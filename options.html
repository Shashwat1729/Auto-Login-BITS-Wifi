<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BITS WiFi Auto Login Settings</title>
    <style>
      :root {
        --primary-color: #2196F3;
        --success-color: #4CAF50;
        --error-color: #f44336;
        --text-primary: #333;
        --text-secondary: #666;
        --background-primary: #ffffff;
        --background-secondary: #f5f7fa;
        --border-color: #e0e0e0;
      }

      body {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        margin: 0;
        padding: 40px;
        background-color: var(--background-secondary);
        color: var(--text-primary);
        line-height: 1.5;
      }

      .container {
        max-width: 600px;
        margin: 0 auto;
      }

      .header {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 32px;
      }

      .header img {
        width: 48px;
        height: 48px;
      }

      h1 {
        font-size: 24px;
        margin: 0;
        color: var(--text-primary);
      }

      .card {
        background-color: var(--background-primary);
        border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        padding: 24px;
        margin-bottom: 24px;
      }

      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      .card-title {
        font-size: 18px;
        font-weight: 600;
        color: var(--text-primary);
        margin: 0;
      }

      .form-group {
        margin-bottom: 24px;
      }

      label {
        display: block;
        font-weight: 500;
        margin-bottom: 8px;
        color: var(--text-primary);
      }

      .input-description {
        font-size: 13px;
        color: var(--text-secondary);
        margin-bottom: 8px;
      }

      textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        font-size: 14px;
        line-height: 1.5;
        resize: vertical;
        min-height: 100px;
        font-family: inherit;
      }

      textarea:focus {
        outline: none;
        border-color: var(--primary-color);
        box-shadow: 0 0 0 2px rgba(33, 150, 243, 0.1);
      }

      .button-group {
        display: flex;
        gap: 12px;
        justify-content: flex-end;
      }

      button {
        padding: 12px 24px;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .primary-button {
        background-color: var(--primary-color);
        color: white;
      }

      .primary-button:hover {
        background-color: #1976D2;
      }

      .secondary-button {
        background-color: var(--background-secondary);
        color: var(--text-primary);
      }

      .secondary-button:hover {
        background-color: #e0e0e0;
      }

      .status-message {
        margin-top: 16px;
        padding: 12px;
        border-radius: 8px;
        font-size: 14px;
        display: none;
      }

      .status-message.show {
        display: block;
      }

      .status-message.success {
        background-color: #E8F5E9;
        color: var(--success-color);
      }

      .status-message.error {
        background-color: #FFEBEE;
        color: var(--error-color);
      }

      .credentials-list {
        margin-top: 16px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        overflow: hidden;
      }

      .credential-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px;
        border-bottom: 1px solid var(--border-color);
      }

      .credential-item:last-child {
        border-bottom: none;
      }

      .credential-info {
        display: flex;
        gap: 16px;
      }

      .credential-username {
        font-weight: 500;
      }

      .credential-password {
        color: var(--text-secondary);
      }

      .delete-button {
        background: none;
        border: none;
        color: var(--error-color);
        cursor: pointer;
        padding: 4px 8px;
        font-size: 13px;
      }

      .delete-button:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <img src="icons/icon128.png" alt="Logo">
        <h1>BITS WiFi Auto Login Settings</h1>
      </div>

      <div class="card">
        <div class="card-header">
          <h2 class="card-title">Credentials Management</h2>
        </div>

        <div class="form-group">
          <label for="usernames">Usernames</label>
          <div class="input-description">Enter multiple usernames, one per line</div>
          <textarea id="usernames" placeholder="Enter usernames"></textarea>
        </div>

        <div class="form-group">
          <label for="passwords">Passwords</label>
          <div class="input-description">Enter corresponding passwords, one per line</div>
          <textarea id="passwords" placeholder="Enter passwords"></textarea>
        </div>

        <div class="button-group">
          <button class="secondary-button" id="resetButton">Reset</button>
          <button class="primary-button" id="saveButton">Save Changes</button>
        </div>

        <div class="status-message" id="statusMessage"></div>
      </div>

      <div class="card">
        <div class="card-header">
          <h2 class="card-title">Saved Credentials</h2>
        </div>
        <div id="credentialsList" class="credentials-list">
          <!-- Credentials will be populated here -->
        </div>
      </div>
    </div>

    <script src="options.js"></script>
  </body>
</html>
