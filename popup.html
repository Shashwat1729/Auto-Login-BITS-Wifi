<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BITS WiFi Auto Login</title>
    <style>
      :root {
        --primary-color: #2196F3;
        --success-color: #4CAF50;
        --error-color: #f44336;
        --text-primary: #333;
        --text-secondary: #666;
        --background-primary: #ffffff;
        --background-secondary: #f5f7fa;
        --border-color: #e0e0e0;
      }

      body {
        width: 340px;
        padding: 20px;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        background-color: var(--background-secondary);
        margin: 0;
        color: var(--text-primary);
      }

      .container {
        background-color: var(--background-primary);
        border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        padding: 20px;
      }

      .header {
        display: flex;
        align-items: center;
        margin-bottom: 24px;
        gap: 12px;
      }

      .header img {
        width: 32px;
        height: 32px;
      }

      h1 {
        font-size: 20px;
        margin: 0;
        color: var(--text-primary);
        font-weight: 600;
      }

      .status-card {
        background-color: var(--background-secondary);
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .status-info {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .status-label {
        font-size: 14px;
        color: var(--text-secondary);
      }

      .status-value {
        font-size: 16px;
        font-weight: 500;
        color: var(--text-primary);
      }

      .switch {
        position: relative;
        display: inline-block;
        width: 44px;
        height: 24px;
      }

      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #ccc;
        transition: .3s;
        border-radius: 24px;
      }

      .slider:before {
        position: absolute;
        content: "";
        height: 18px;
        width: 18px;
        left: 3px;
        bottom: 3px;
        background-color: white;
        transition: .3s;
        border-radius: 50%;
      }

      input:checked + .slider {
        background-color: var(--primary-color);
      }

      input:checked + .slider:before {
        transform: translateX(20px);
      }

      .button-group {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 20px;
      }

      button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .primary-button {
        background-color: var(--primary-color);
        color: white;
      }

      .primary-button:hover {
        background-color: #1976D2;
      }

      .secondary-button {
        background-color: var(--background-secondary);
        color: var(--text-primary);
      }

      .secondary-button:hover {
        background-color: #e0e0e0;
      }

      .status-message {
        margin-top: 16px;
        padding: 12px;
        border-radius: 6px;
        font-size: 13px;
        text-align: center;
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .status-message.show {
        opacity: 1;
      }

      .status-message.success {
        background-color: #E8F5E9;
        color: var(--success-color);
      }

      .status-message.error {
        background-color: #FFEBEE;
        color: var(--error-color);
      }

      .spinner {
        width: 16px;
        height: 16px;
        border: 2px solid #ffffff;
        border-top: 2px solid transparent;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        display: none;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .connection-status {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 16px;
        padding: 12px;
        background-color: var(--background-secondary);
        border-radius: 8px;
        font-size: 13px;
        margin-bottom: 12px;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: #ccc;
      }

      .status-dot.connected {
        background-color: var(--success-color);
      }

      .status-dot.disconnected {
        background-color: var(--error-color);
      }

      .last-login-card {
        background-color: var(--background-secondary);
        border-radius: 8px;
        padding: 14px 16px;
        margin-bottom: 18px;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 14px;
      }
      .last-login-label {
        color: var(--text-secondary);
        margin-right: 8px;
      }
      .last-login-value {
        font-weight: 600;
        color: var(--text-primary);
      }

      .connection-history {
        margin-top: 0;
        font-size: 13px;
      }
      .connection-history h3 {
        font-size: 15px;
        font-weight: 600;
        margin: 0 0 8px 0;
        color: var(--text-primary);
      }
      .history-item {
        display: flex;
        justify-content: space-between;
        padding: 8px 0;
        border-bottom: 1px solid var(--border-color);
      }
      .history-item:last-child {
        border-bottom: none;
      }
      .history-time {
        color: var(--text-secondary);
      }
      .toggle-label {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        border: 0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <img src="icons/icon128.png" alt="Logo">
        <h1>BITS WiFi Auto Login</h1>
      </div>

      <div class="status-card">
        <div class="status-info">
          <span class="status-label">Auto Login</span>
          <span class="status-value" id="statusText">Enabled</span>
        </div>
        <label class="switch">
          <span class="toggle-label">Toggle Auto Login</span>
          <input type="checkbox" id="toggleExtension" checked aria-label="Toggle auto login">
          <span class="slider"></span>
        </label>
      </div>

      <div class="form-group" style="margin-bottom: 16px;">
        <label for="credentialSelect" style="font-size:14px;color:var(--text-secondary);margin-bottom:4px;">Login as</label>
        <select id="credentialSelect" style="width:100%;padding:8px 10px;border-radius:6px;border:1px solid var(--border-color);font-size:14px;"></select>
      </div>

      <div class="button-group">
        <button class="primary-button" id="checkInternet">
          <span>Check & Login</span>
          <div class="spinner" id="loginSpinner"></div>
        </button>
        <button class="secondary-button" id="openSettings">
          <span>Settings</span>
        </button>
      </div>

      <div class="connection-status">
        <div class="status-dot" id="connectionDot"></div>
        <span id="connectionStatus">Checking connection...</span>
      </div>

      <div class="last-login-card">
        <span class="last-login-label">Last Login</span>
        <span class="last-login-value" id="lastLogin">Never</span>
      </div>
      <div class="last-login-card">
        <span class="last-login-label">Connected as</span>
        <span class="last-login-value" id="lastUsername">-</span>
      </div>

      <div class="connection-history">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <h3 style="margin:0;">Recent Activity</h3>
          <button id="clearActivityBtn" style="font-size:12px;padding:6px 12px;border-radius:6px;border:none;background:var(--background-secondary);color:var(--error-color);cursor:pointer;">Clear Activity</button>
        </div>
        <div id="historyList">
          <!-- History items will be populated here -->
        </div>
      </div>

      <div class="status-message" id="statusMessage"></div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
